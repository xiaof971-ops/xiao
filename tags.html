    <script>
    (function () {
        var chips = document.querySelectorAll('#tag-bar .tag-chip');
        var items = document.querySelectorAll('#tag-list .archive-item');
        function apply(tag) {
            chips.forEach(function (c) {
                c.classList.toggle('on', decodeURIComponent(c.getAttribute('href').slice(1)) === tag || (tag === '全部' && c.getAttribute('href') === '#全部'));
            });
            items.forEach(function (it) {
                it.style.display = (tag === '全部' || it.getAttribute('data-tag') === tag) ? '' : 'none';
            });
        }
        function fromHash() {
            var h = decodeURIComponent(location.hash.replace('#', '')) || '全部';
            apply(h);
        }
        chips.forEach(function (c) {
            c.addEventListener('click', function () {
                setTimeout(fromHash, 0);
            });
        });
        window.addEventListener('hashchange', fromHash);
        fromHash();
    })();
    </script>
